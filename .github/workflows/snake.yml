name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d63384&color_dots=#ebedf0,#fbcfe8,#f9a8d4,#ec4899,#be185d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff79c6&color_dots=#161b22,#4a1d3d,#8c2f6b,#d14a9e,#ff79c6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
